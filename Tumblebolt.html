{const d=new T.Mesh(new T.CylinderGeometry(4,4.3,.6,24),M(0x2a1840));d.position.set(1000,-.9,0);stage.add(d);stage.visible=false;sc.add(stage)}

let carG,wh=[];

 A(L*.5,.03,.22,0xfff7e0,L*.38,.39,0);A(.2,.2,bw*1.06,dk,L*.65,-.08,0);A(.2,.2,bw*1.06,dk,-L*.65,-.08,0);

 A(.38,.06,bw*1.1,dk,-L*.58,.58,0);A(.06,.06,.06,0x888888,-L*.66,-.1,bw*.3);wh=[];

 for(let i=0;i<2;i++){const lx=(i?1:-1)*q.ax,ly=-.1,wx=q.x+lx*c-ly*s,wy=q.y+lx*s+ly*c,rvx=q.vx-q.w*(wy-q.y),rvy=q.vy+q.w*(wx-q.x),g=ground(wx,wy);let dist=9;
